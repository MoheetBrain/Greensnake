# =============================================================================
# BACKTEST COHORT — winners AND a matched failure/mediocre set
# =============================================================================
# Studying only OpenAI/SpaceX/Stripe proves nothing: famous winners have famous
# investors by definition. Every winner class below is paired with companies
# that attracted comparable elite/institutional backing and did NOT become
# enormous -- shutdowns, fire sales, down rounds, stagnation.
#
# `outcome` is a FACTUAL claim about what happened. `outcome_evidence` records
# its status:
#   SOURCED             -- a source URL is attached
#   PENDING_VERIFICATION-- compiled from the public record, not yet source-linked
#                          in this repository. Treated as provisional; the
#                          verification workstream must confirm or correct it.
# A company whose fate cannot be established is labelled UNRESOLVED, never guessed.
#
# Labels: WINNER (>= ~$10B or transformative) · STRONG (large but not outlier)
#         MEDIOCRE (flat / disappointing / fire-sale) · FAILURE (shut down,
#         bankrupt, written off) · UNRESOLVED
# =============================================================================
compiled: "2026-09-16"

cohort:

