# --------------------------------- NEGATIVE CONTROLS: MEDIOCRE OUTCOMES -----
- {name: Magic Leap,      outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "AR; multi-billion raised, severe down round and pivot."}
- {name: Inflection AI,   outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "Frontier AI lab that raised ~$1.3B and was effectively absorbed by Microsoft in 2024 -- elite founders, non-outlier outcome. A crucial control."}
- {name: Adept AI,        outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "Agent lab effectively absorbed by Amazon 2024."}
