- {name: Bloom Energy,    outcome: WINNER, outcome_evidence: PENDING_VERIFICATION, note: "RELABELLED 2026-09-16 (was MEDIOCRE). Now ~$80bn versus ~$1.6bn at its 2018 IPO -- roughly a 50x outcome. Leaving a 50x in the negative-control arm would have biased the backtest AGAINST finding signal, which is the most dangerous direction for a test of this kind."}
- {name: Virgin Galactic, outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "Space tourism; severe post-SPAC decline."}
- {name: Clover Health,   outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "Insurance; severe post-SPAC decline."}
- {name: Opendoor,        outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "iBuying; severe post-SPAC decline."}
- {name: Blue Apron,      outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "Meal kits; collapsed from IPO price, sold cheaply."}
- {name: Bird,            outcome: FAILURE, outcome_evidence: PENDING_VERIFICATION, note: "RELABELLED 2026-09-16 (was MEDIOCRE). Chapter 11 in Dec 2023; assets sold to a lender-owned vehicle and the listed equity did not survive. That is a failure, not a disappointment."}
- {name: Casper,          outcome: MEDIOCRE, outcome_evidence: PENDING_VERIFICATION, note: "DTC mattresses; taken private well below IPO."}
