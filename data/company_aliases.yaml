# Curated company entity-resolution overrides.
# `merges`: raw strings that must resolve to one canonical entity.
# `do_not_merge`: name groups that normalisation might collapse but must not be.
# `basis`: what established the identity -- edge evidence read on both sides,
#          never name similarity alone.
# Every entry is a naming/corporate-structure fact, not an investment claim.
