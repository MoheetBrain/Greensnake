# =============================================================================
# GREENSNAKE PEOPLE CANDIDATE UNIVERSE
# =============================================================================
# WHAT THIS FILE IS
#   The *design* layer of the graph: who we track and why. Selection favours
#   INFORMATION ACCESS and TECHNICAL INTELLIGENCE over wealth. A Hassabis-type
#   node is worth more here than a billionaire with no frontier-technology edge.
#
# WHAT THIS FILE IS NOT
#   It contains NO investment claims. Not one. `affiliation` records a widely
#   documented public role as of the compile date; everything about who invested
#   in what lives in person_company_edges, each row carrying its own sources.
#
# SCORES: ordinal 0-5 bands, ANALYTICAL INTERPRETATION by the orchestrator, with
#   anchors in docs/METHODOLOGY.md. They are deliberately coarse -- public
#   evidence does not justify decimals. They NEVER alter raw overlap counts.
#   access      = likelihood of seeing frontier companies before ordinary investors
#   technical   = capacity to independently understand frontier science/engineering
#   early_stage = documented record of backing eventual majors unusually early
#   network     = depth of connection into elite founder networks
#   capital     = freedom to make unusual, illiquid, high-risk private bets
#   independence= how orthogonal their information source is to the rest of the pool
#   `early_stage: null` means "no public investing record to judge" -- not zero.
#
# signal_class is a PRIOR. It is revised in docs/PEOPLE_CLASSIFICATION.md after
#   the graph is built, using derived investment_visibility and herding_risk.
# =============================================================================
compiled: "2026-09-16"
method_version: "people-universe-v1"

